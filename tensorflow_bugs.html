<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TensorFlow Bug Reports</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons"/>
</head>

<body>

<div class="bugs-dashboard">

  <!-- REFACTOR: was a hand-written title-group + stats block (identical structure to
       pytorch_bugs.html / skill_badges.html). renderScoreboard() in index.js fills this
       in from the data below, so the markup only has to exist in one place. -->
  <div class="scoreboard" id="scoreboard-mount"></div>

    <div class="dashboard">

        <!-- Bug Analysis -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">Bug Analysis</div>
            </div>
            <div class="card-body">
                <div class="analysis-wrap">
                    <div class="chart-canvas-box">
                        <canvas id="bugAnalysisdonut"></canvas>
                    </div>
                    <div class="bar-chart-box">
                        <canvas id="bugCategoryBar"></canvas>
                    </div>
                </div>    
                    
                <div class="legend">
                    <div class="legend-item"><span class="legend-dot dot-violet"></span>Closed</div>
                    <div class="legend-item"><span class="legend-dot dot-green"></span>Confirmed</div>
                    <div class="legend-item"><span class="legend-dot dot-red"></span>Rejected</div>
                    <div class="legend-item"><span class="legend-dot dot-amber"></span>Open</div>
                </div>
            </div>
        </div>

        <!-- Compiler Issues -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">Compiler bugs</div>
            </div>
            <div class="card-body">
                <!-- REFACTOR: renderIssueList("CompilerBugsList", compilerBugs) fills this in -->
                <div class="scroll-card" id="CompilerBugsList"></div>
            </div>
        </div>

        <!-- RB Fuzzer Bugs -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">RBFuzzer Bugs</div>
            </div>
            <div class="card-body">
                <div class="scroll-card" id="RBFuzzerList"></div>
            </div>
        </div>

        <!-- XLA Bugs -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">XLA Bugs</div>
            </div>
            <div class="card-body">
                <div class="scroll-card" id="XLABugsList"></div>
            </div>
        </div>
    </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.0/ScrollTrigger.min.js"></script>
<script src="./index.js"></script>
